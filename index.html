<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --paper: #FBF3EA;
    --paper-2: #F1E2D2;
    --paper-3: #EAD8C4;
    --ink: #3B2A20;
    --ink-soft: #6b5342;
    --wine: #7C2D3B;
    --blush: #F1C7CF;
    --gold: #B08340;
    --seal: #8C2B34;
  }
  
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #241a15;
      --paper-2: #2c211a;
      --paper-3: #382a20;
      --ink: #f1e4d6;
      --ink-soft: #cbb8a5;
      --wine: #e6a3ac;
      --blush: #5c3a3f;
      --gold: #d8b26e;
      --seal: #b5535c;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(124,45,59,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(176,131,64,0.06), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Escena 1: Sobre ---------- */
  #scene-envelope {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vw, 32px);
    padding: 24px 20px;
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 2;
  }

  #scene-envelope.hidden {
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
    display: none !important;
  }

  .to-label {
    font-family: 'Caveat', cursive;
    font-size: clamp(32px, 7vw, 44px);
    color: var(--wine);
    letter-spacing: .5px;
  }

  .envelope-wrap {
    --w: min(82vw, 320px);
    width: var(--w);
    aspect-ratio: 3/2;
    position: relative;
    cursor: pointer;
    perspective: 1000px; /* Corrección 3D */
    -webkit-tap-highlight-color: transparent;
  }

  .envelope-wrap:focus-visible {
    outline: 2px solid var(--wine);
    outline-offset: 6px;
    border-radius: 6px;
  }

  .envelope-body {
    position: absolute; inset: 0;
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    box-shadow: 0 14px 28px rgba(59,42,32,0.25);
    overflow: hidden;
    transition: transform .25s ease;
  }

  .envelope-wrap:hover .envelope-body { transform: translateY(-3px); }

  .envelope-body::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(155deg, transparent 49.4%, var(--ink) 49.4%, var(--ink) 50.2%, transparent 50.6%),
      linear-gradient(205deg, transparent 49.4%, var(--ink) 49.4%, var(--ink) 50.2%, transparent 50.6%);
    background-size: 100% 62%, 100% 62%;
    background-repeat: no-repeat;
    background-position: left bottom, right bottom;
    opacity: .45;
  }

  .letter-peek {
    position: absolute;
    left: 6%; right: 6%; bottom: 8%; top: 14%;
    background: var(--paper);
    border: 1.2px solid var(--ink);
    border-radius: 2px;
    transform: translateY(78%);
    transition: transform .6s cubic-bezier(.2,.8,.25,1);
    z-index: 1;
  }

  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: var(--paper-3);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-bottom: 1.5px solid var(--ink);
    transform-origin: top center;
    transition: transform .6s ease;
    z-index: 3;
    backface-visibility: hidden;
  }

  .seal {
    position: absolute; left: 50%; top: 46%;
    width: clamp(40px, 10vw, 52px); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: var(--seal);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,.3);
    z-index: 4;
    transition: opacity .3s ease, transform .3s ease;
  }
  .seal svg { width: 50%; height: 50%; }

  /* Estado abierto */
  .envelope-wrap.open .flap {
    transform: rotateX(180deg);
    z-index: 0;
  }
  .envelope-wrap.open .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.3);
  }
  .envelope-wrap.open .letter-peek {
    transform: translateY(-20%);
  }

  .open-hint {
    font-size: clamp(14px, 3.5vw, 16px);
    color: var(--ink-soft);
    letter-spacing: .03em;
  }

  /* ---------- Escena 2: Carta ---------- */
  #scene-letter {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    opacity: 0;
    display: none;
    transition: opacity 0.8s ease;
    z-index: 1;
    text-align: center;
  }

  #scene-letter.visible {
    display: block;
    opacity: 1;
  }

  .letter-head { margin-bottom: 16px; }
  .script { font-family: 'Caveat', cursive; }
  .letter-head .script { font-size: clamp(28px, 6vw, 36px); color: var(--wine); }

  .beats {
    display: flex;
    flex-direction: column;
    gap: clamp(32px, 6vw, 48px);
    margin: 36px 0;
  }
  .beat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .beat:nth-child(even) .keepsake { transform: rotate(2deg); }
  .beat:nth-child(odd) .keepsake { transform: rotate(-2deg); }

  .keepsake {
    width: min(75%, 260px);
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: 8px 8px 18px;
    box-shadow: 0 12px 20px -10px rgba(59,42,32,0.3);
    position: relative;
  }
  .keepsake img { display: block; width: 100%; height: auto; border-radius: 1px; }
  .keepsake::after {
    content: "";
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    width: 44px; height: 16px;
    background: rgba(241,199,207,.7);
    border: 1px solid rgba(59,42,32,.2);
  }

  .beat-cap {
    font-size: clamp(20px, 4.5vw, 24px);
    color: var(--ink-soft);
  }

  .headline {
    font-style: italic;
    font-size: clamp(28px, 6vw, 42px);
    line-height: 1.3;
    margin: 20px 0;
  }
  .wine { color: var(--wine); }

  .flourish {
    display: flex; align-items: center; gap: 14px;
    margin: 30px 0;
  }
  .flourish::before, .flourish::after {
    content: ""; flex: 1; height: 1px; background: var(--ink-soft); opacity: .3;
  }
  .flourish svg { width: 20px; height: 20px; fill: var(--wine); }

  .closing .script { font-size: clamp(26px, 5vw, 32px); color: var(--wine); }
  .closing .date { font-size: 14px; color: var(--ink-soft); display: block; margin-top: 6px; }

  #hearts-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden;
  }
  .heart-icon {
    position: absolute; bottom: -40px;
    width: 20px; height: 20px;
    fill: var(--wine);
    opacity: 0;
    animation: rise 3.5s ease-in forwards;
  }

  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(.6) rotate(0deg); }
    15% { opacity: .8; }
    100% { opacity: 0; transform: translateY(-105vh) scale(1.2) rotate(25deg); }
  }

  .forever-btn {
    display: inline-block;
    margin-top: 28px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--wine);
    background: transparent;
    border: 1px solid var(--wine);
    padding: 10px 28px;
    border-radius: 30px;
    cursor: pointer;
    transition: all .3s ease;
  }
  .forever-btn:hover { background: var(--wine); color: var(--paper); transform: translateY(-2px); }
</style>
</head>
<body>

<div id="hearts-layer"></div>

<section id="scene-envelope">
  <span class="to-label">Para Ana</span>
  <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Abrir la carta">
    <div class="letter-peek"></div>
    <div class="envelope-body"></div>
    <div class="flap"></div>
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 20s-7.5-4.6-10-9.3C0.4 7.6 2 4 5.4 4c2 0 3.4 1.1 4.1 2.3C10.2 5.1 11.6 4 13.6 4 17 4 18.6 7.6 17 10.7 15.5 15.4 12 20 12 20Z" fill="var(--paper)"/>
      </svg>
    </div>
  </div>
  <span class="open-hint">Toca el sobre para abrirlo</span>
</section>

    <span class="script">Para ti, Ana</span>

<script>
  const envelope = document.getElementById('envelope');
  const sceneEnvelope = document.getElementById('scene-envelope');
  const sceneLetter = document.getElementById('scene-letter');
  const heartsLayer = document.getElementById('hearts-layer');

  function openLetter() {
    if (envelope.classList.contains('open')) return;
    
    envelope.classList.add('open');

    // Esperar a que la solapa se abra antes de ocultar la escena
    setTimeout(() => {
      sceneEnvelope.classList.add('hidden');
      sceneLetter.classList.add('visible');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      createHearts(12);
    }, 900);
  }

  // Eventos de apertura
  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('touchstart', (e) => {
    e.preventDefault();
    openLetter();
  }, { passive: false });

  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLetter();
    }
  });

  // Animación de Corazones
  function createHearts(count) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart-icon';
        heart.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        
        heart.style.left = Math.random() * 90 + 5 + 'vw';
        heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
        
        heartsLayer.appendChild(heart);
        
        setTimeout(() => heart.remove(), 4000);
      }, i * 150);
    }
  }

  function celebrate() {
    createHearts(25);
  }
</script>

</body>
