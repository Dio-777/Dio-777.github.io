<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A = f(❤)</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #0d0814;
    color: #f7e8ed;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* Fondo de estrellas/fórmulas sutiles */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  /* Encabezado Matemático / Poético */
  .header {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-bottom: 20px;
    padding: 0 10px;
  }

  .formula {
    font-size: clamp(14px, 3.5vw, 18px);
    color: #e28fa0;
    letter-spacing: 2px;
    margin-bottom: 6px;
    opacity: 0.85;
  }

  .subtext {
    font-size: clamp(11px, 2.8vw, 13px);
    color: #8a738c;
    font-style: italic;
  }

  /* Lienzo principal donde se dibuja "ANA" con la función de corazón */
  .canvas-container {
    position: relative;
    z-index: 10;
    width: 100vw;
    height: 55vh;
    max-width: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #heart-canvas {
    width: 100%;
    height: 100%;
  }

  /* Pie de página interactivo */
  .footer {
    position: relative;
    z-index: 10;
    margin-top: 15px;
    text-align: center;
  }

  .touch-hint {
    font-size: 12px;
    color: #e28fa0;
    border: 1px solid rgba(226, 143, 160, 0.3);
    padding: 8px 18px;
    border-radius: 20px;
    background: rgba(226, 143, 160, 0.05);
    animation: pulse 2s infinite;
    cursor: pointer;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 15px rgba(226, 143, 160, 0.3); }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="header">
  <div class="formula">f(x, y) = (x² + y² - 1)³ - x²y³ = 0</div>
  <div class="subtext">Cada punto converge en la misma constante...</div>
</div>

<div class="canvas-container">
  <canvas id="heart-canvas"></canvas>
</div>

<div class="footer">
  <div class="touch-hint" id="interactive-btn">Toca la pantalla para alterar la ecuación</div>
</div>

<script>
  const canvas = document.getElementById('heart-canvas');
  const ctx = canvas.getContext('2d');
  const bgCanvas = document.getElementById('bg-canvas');
  const bgCtx = bgCanvas.getContext('2d');

  let width, height;
  let heartParticles = [];
  let burstParticles = [];

  // Definición matricial de los trazos de la palabra "ANA" (en rejilla de puntos)
  const nameGrid = [
    // Letra A
    {x: 0.15, y: 0.8}, {x: 0.18, y: 0.6}, {x: 0.21, y: 0.4}, {x: 0.24, y: 0.2}, 
    {x: 0.27, y: 0.4}, {x: 0.30, y: 0.6}, {x: 0.33, y: 0.8},
    {x: 0.19, y: 0.55}, {x: 0.24, y: 0.55}, {x: 0.29, y: 0.55},

    // Letra N
    {x: 0.43, y: 0.8}, {x: 0.43, y: 0.6}, {x: 0.43, y: 0.4}, {x: 0.43, y: 0.2},
    {x: 0.47, y: 0.4}, {x: 0.51, y: 0.6}, {x: 0.55, y: 0.8},
    {x: 0.55, y: 0.6}, {x: 0.55, y: 0.4}, {x: 0.55, y: 0.2},

    // Letra A
    {x: 0.65, y: 0.8}, {x: 0.68, y: 0.6}, {x: 0.71, y: 0.4}, {x: 0.74, y: 0.2}, 
    {x: 0.77, y: 0.4}, {x: 0.80, y: 0.6}, {x: 0.83, y: 0.8},
    {x: 0.69, y: 0.55}, {x: 0.74, y: 0.55}, {x: 0.79, y: 0.55}
  ];

  function resize() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    initParticles();
    drawBackground();
  }

  // Dibuja una mini silueta de corazón en coordenadas (x,y)
  function drawHeartSymbol(context, x, y, size, color, alpha) {
    context.save();
    context.translate(x, y);
    context.globalAlpha = alpha;
    context.fillStyle = color;
    context.beginPath();
    context.moveTo(0, 0);
    context.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
    context.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
    context.fill();
    context.restore();
  }

  // Partículas que forman el nombre con vibración paramétrica de corazón
  class HeartParticle {
    constructor(baseX, baseY) {
      this.baseX = baseX;
      this.baseY = baseY;
      this.size = Math.random() * 4 + 6;
      this.angle = Math.random() * Math.PI * 2;
      this.speed = Math.random() * 0.03 + 0.02;
      this.amplitude = Math.random() * 6 + 3;
      this.color = `hsl(${Math.random() * 20 + 340}, 80%, 65%)`;
    }

    update() {
      this.angle += this.speed;
      // Función cardioide de palpitación
      const pulse = Math.sin(this.angle) * this.amplitude;
      this.x = this.baseX + Math.cos(this.angle) * (pulse * 0.5);
      this.y = this.baseY + Math.sin(this.angle) * (pulse * 0.5);
    }

    draw() {
      drawHeartSymbol(ctx, this.x, this.y, this.size, this.color, 0.9);
    }
  }

  // Partículas flotantes de explosión interactiva
  class BurstParticle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const force = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * force;
      this.vy = Math.sin(angle) * force;
      this.size = Math.random() * 6 + 4;
      this.alpha = 1;
      this.color = `hsl(${Math.random() * 40 + 330}, 90%, 70%)`;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.05; // Gravedad suave
      this.alpha -= 0.015;
    }

    draw() {
      if (this.alpha > 0) {
        drawHeartSymbol(ctx, this.x, this.y, this.size, this.color, this.alpha);
      }
    }
  }

  function initParticles() {
    heartParticles = [];
    
    // Generar partículas en densidad a lo largo de la rejilla de "ANA"
    nameGrid.forEach(pt => {
      const targetX = pt.x * width;
      const targetY = pt.y * height;

      // Crear varios puntos por cada posición para rellenar
      for (let i = 0; i < 5; i++) {
        const offsetX = (Math.random() - 0.5) * 16;
        const offsetY = (Math.random() - 0.5) * 16;
        heartParticles.push(new HeartParticle(targetX + offsetX, targetY + offsetY));
      }
    });
  }

  function drawBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    bgCtx.fillStyle = '#4a2e40';
    bgCtx.font = '12px Courier New';

    // Dibujar ecuaciones matemáticas aleatorias flotando tenue en el fondo
    const mathSymbols = ['lim t→∞', '∫♥ dt', 'r = 1-sin(θ)', 'Ana', 'e^(iπ) + 1 = 0', 'x² + y² = ∞', '∇ × F = 0'];
    for (let i = 0; i < 35; i++) {
      const x = Math.random() * bgCanvas.width;
      const y = Math.random() * bgCanvas.height;
      const symbol = mathSymbols[Math.floor(Math.random() * mathSymbols.length)];
      bgCtx.fillText(symbol, x, y);
    }
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    // Actualizar y dibujar el nombre formado por corazones
    heartParticles.forEach(p => {
      p.update();
      p.draw();
    });

    // Actualizar explosiones al tocar
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.update();
      p.draw();
      if (p.alpha <= 0) {
        burstParticles.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  // Interacción al tocar/dar clic
  function triggerBurst(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

    for (let i = 0; i < 20; i++) {
      burstParticles.push(new BurstParticle(x, y));
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('click', triggerBurst);
  window.addEventListener('touchstart', (e) => {
    triggerBurst(e);
  }, { passive: true });

  // Inicialización
  resize();
  animate();
</script>

</body>
</html>
