<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --paper:#FBF3EA;
    --paper-2:#F1E2D2;
    --paper-3:#EAD8C4;
    --ink:#3B2A20;
    --ink-soft:#6b5342;
    --wine:#7C2D3B;
    --blush:#F1C7CF;
    --gold:#B08340;
    --seal:#8C2B34;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#241a15;
      --paper-2:#2c211a;
      --paper-3:#382a20;
      --ink:#f1e4d6;
      --ink-soft:#cbb8a5;
      --wine:#e6a3ac;
      --blush:#5c3a3f;
      --gold:#d8b26e;
      --seal:#b5535c;
    }
  }
  :root[data-theme="dark"]{
    --paper:#241a15;
    --paper-2:#2c211a;
    --paper-3:#382a20;
    --ink:#f1e4d6;
    --ink-soft:#cbb8a5;
    --wine:#e6a3ac;
    --blush:#5c3a3f;
    --gold:#d8b26e;
    --seal:#b5535c;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(124,45,59,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(176,131,64,0.06), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  a{color:var(--wine);}
  .script{ font-family:'Caveat', cursive; }

  /* ---------- Scene 1: envelope ---------- */
  #scene-envelope{
    position:relative;
    min-height:100svh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,4vw,32px);
    padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);
    transition:opacity .6s ease;
    z-index:1;
  }
  #scene-envelope.leaving{
    opacity:0;
    pointer-events:none;
  }
  .to-label{
    font-family:'Caveat', cursive;
    font-size:clamp(28px,6vw,40px);
    color:var(--wine);
    letter-spacing:.5px;
  }

  .envelope-wrap{
    --w:min(78vw,320px);
    width:var(--w);
    aspect-ratio:3/2;
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .envelope-wrap:focus-visible{ outline:2px solid var(--wine); outline-offset:6px; border-radius:6px; }

  .envelope-body{
    position:absolute; inset:0;
    background:var(--paper-2);
    border:1.5px solid var(--ink);
    border-radius:4px;
    box-shadow:0 18px 30px -18px rgba(59,42,32,.45);
    overflow:hidden;
    transition:transform .25s ease;
  }
  .envelope-wrap:hover .envelope-body{ transform:translateY(-3px); }

  .envelope-body::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; top:0;
    background:
      linear-gradient(155deg, transparent 49.4%, var(--ink) 49.4%, var(--ink) 50.2%, transparent 50.6%),
      linear-gradient(205deg, transparent 49.4%, var(--ink) 49.4%, var(--ink) 50.2%, transparent 50.6%);
    background-size:100% 62%, 100% 62%;
    background-repeat:no-repeat;
    background-position:left bottom, right bottom;
    opacity:.55;
  }

  .letter-peek{
    position:absolute;
    left:6%; right:6%; bottom:8%;
    top:14%;
    background:var(--paper);
    border:1.2px solid var(--ink);
    border-radius:2px;
    box-shadow:0 2px 0 rgba(59,42,32,.08);
    transform:translateY(78%);
    transition:transform .7s cubic-bezier(.2,.8,.25,1);
    z-index:1;
  }

  .flap{
    position:absolute; left:0; right:0; top:0; height:56%;
    background:var(--paper-3);
    clip-path:polygon(0 0, 100% 0, 50% 92%);
    border-bottom:1.5px solid var(--ink);
    transform-origin:top center;
    transition:transform .6s cubic-bezier(.3,.7,.2,1);
    z-index:3;
    box-shadow:inset 0 -6px 10px -8px rgba(59,42,32,.4);
  }

  .seal{
    position:absolute; left:50%; top:44%;
    width:clamp(38px,9vw,52px); aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:var(--seal);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.25);
    z-index:4;
    transition:opacity .35s ease, transform .35s ease;
  }
  .seal svg{ width:52%; height:52%; }

  .envelope-wrap.open .flap{ transform:rotateX(178deg); }
  .envelope-wrap.open .seal{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
  .envelope-wrap.open .letter-peek{ transform:translateY(6%); }

  .open-hint{
    font-size:clamp(14px,3.4vw,16px);
    color:var(--ink-soft);
    letter-spacing:.02em;
  }

  /* ---------- Scene 2: letter ---------- */
  #scene-letter{
    position:relative;
    max-width:640px;
    margin:0 auto;
    padding:64px 24px calc(env(safe-area-inset-bottom,0px) + 110px);
    opacity:0;
    z-index:1;
    text-align:center;
  }
  #scene-letter.visible{ opacity:1; }

  .letter-head{ margin-bottom:8px; }
  .letter-head .script{ font-size:clamp(22px,5vw,28px); color:var(--wine); display:block; }

  .beats{
    display:flex;
    flex-direction:column;
    gap:clamp(30px,7vw,48px);
    margin:48px 0 56px;
  }
  .beat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .beat:nth-child(even) .keepsake{ transform:rotate(3deg); }
  .beat:nth-child(odd) .keepsake{ transform:rotate(-3deg); }

  .keepsake{
    width:min(64%,240px);
    background:var(--paper);
    border:1px solid var(--ink);
    padding:8px 8px 18px;
    box-shadow:0 16px 26px -18px rgba(59,42,32,.5);
    position:relative;
  }
  .keepsake img{ display:block; width:100%; height:auto; border-radius:1px; }
  .keepsake::after{
    content:"";
    position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:44px; height:16px;
    background:rgba(241,199,207,.65);
    border:1px solid rgba(59,42,32,.25);
  }
  .beat-cap{
    font-family:'Caveat', cursive;
    font-size:clamp(20px,4.4vw,24px);
    color:var(--ink-soft);
  }

  .headline{
    font-style:italic;
    font-weight:500;
    font-size:clamp(34px,8vw,54px);
    line-height:1.2;
    margin:0 0 8px;
  }
  .headline .wine{ color:var(--wine); }

  .flourish{
    display:flex; align-items:center; gap:14px;
    margin:36px 0 34px;
  }
  .flourish::before, .flourish::after{
    content:""; flex:1; height:1px; background:var(--ink-soft); opacity:.4;
  }
  .flourish svg{ width:20px; height:20px; color:var(--wine); flex:none; }

  .closing{ margin-top:10px; }
  .closing .script{ font-size:clamp(24px,5vw,30px); color:var(--wine); }
  .closing .date{ font-size:15px; color:var(--ink-soft); display:block; margin-top:4px;}

  #hearts-layer{
    position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;
  }
  #hearts-layer svg{
    position:absolute; bottom:-40px;
    width:18px; height:18px;
    color:var(--wine);
    opacity:0;
    animation:rise 3.4s ease-in forwards;
  }
  @keyframes rise{
    0%{ opacity:0; transform:translateY(0) scale(.7) rotate(0deg); }
    12%{ opacity:.9; }
    100%{ opacity:0; transform:translateY(-100vh) scale(1.1) rotate(18deg); }
  }

  .forever-btn{
    display:block;
    margin:36px auto 0;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19px;
    color:var(--wine);
    background:transparent;
    border:1px solid var(--wine);
    padding:10px 26px;
    border-radius:2px;
    cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .forever-btn:hover{ background:var(--wine); color:var(--paper); }
  .forever-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<section id="scene-envelope">
  <span class="to-label">Para Ana</span>
  <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Abrir la carta">
    <div class="letter-peek"></div>
    <div class="envelope-body"></div>
    <div class="flap"></div>
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20s-7.5-4.6-10-9.3C0.4 7.6 2 4 5.4 4c2 0 3.4 1.1 4.1 2.3C10.2 5.1 11.6 4 13.6 4 17 4 18.6 7.6 17 10.7 15.5 15.4 12 20 12 20Z" fill="var(--paper)"/>
      </svg>
    </div>
  </div>
  <span class="open-hint">toca el sobre para abrirlo</span>
</section>

    <span class="script">Para ti, Ana</span>

<div id="hearts-layer" aria-hidden="true"></div>

<script>
(function(){
  var envelope = document.getElementById('envelope');
  var sceneEnvelope = document.getElementById('scene-envelope');
  var sceneLetter = document.getElementById('scene-letter');
  var opened = false;

  function openLetter(){
    if(opened) return;
    opened = true;
    envelope.classList.add('open');
    setTimeout(function(){
      sceneEnvelope.classList.add('leaving');
      sceneLetter.classList.add('visible');
      sceneLetter.scrollIntoView({behavior:'smooth', block:'start'});
    }, 650);
  }

  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLetter(); }
  });

  try{
    var d = new Date();
    var months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    document.getElementById('today-date').textContent = d.getDate() + ' de ' + months[d.getMonth()] + ' de ' + d.getFullYear();
  }catch(e){}

  var heartsLayer = document.getElementById('hearts-layer');
  var heartSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C0.4 8.6 2 5 5.4 5c2 0 3.4 1.1 4.1 2.3C10.2 6.1 11.6 5 13.6 5 17 5 18.6 8.6 17 11.7 15.5 16.4 12 21 12 21Z"/></svg>';
  var fired = false;
  document.getElementById('forever-btn').addEventListener('click', function(){
    if(fired) return;
    fired = true;
    for(var i=0;i<14;i++){
      (function(i){
        setTimeout(function(){
          var el = document.createElement('div');
          el.innerHTML = heartSVG;
          var svg = el.firstChild;
          svg.style.left = (10 + Math.random()*80) + 'vw';
          svg.style.animationDuration = (2.6 + Math.random()*1.6) + 's';
          svg.style.width = svg.style.height = (12 + Math.random()*14) + 'px';
          heartsLayer.appendChild(svg);
          setTimeout(function(){ svg.remove(); }, 4200);
        }, i*90);
      })(i);
    }
  });
})();
</script>
